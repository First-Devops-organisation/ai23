trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Ensure this matches the feed name in Azure Artifacts
  # and the <id> in your pom.xml <repository> section.
  feedName: 'github_migration_feed'

steps:
- task: MavenAuthenticate@0
  displayName: 'Maven Authenticate'
  inputs:
    artifactsFeeds: '$(feedName)'

- task: Maven@4
  displayName: 'Build and Deploy Maven Package'
  inputs:
    mavenPomFile: 'pom.xml'
    # 'deploy' goal builds the package and uploads it to the feed
    goals: 'deploy'
    options: '-DskipTests'
    publishJUnitResults: false
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '1.11'
    mavenVersionOption: 'Default'
    mavenAuthenticateFeed: false
    effectivePomSkip: false
    sonarQubeRunAnalysis: false
