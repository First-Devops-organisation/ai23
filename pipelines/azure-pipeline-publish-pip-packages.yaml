trigger: none

parameters:
- name: package
  displayName: "Pip Package Name (e.g. azure-cli)"
  type: string

variables:
  - name: feedName
    value: "github_migration_feed"

stages:
  - stage: publish_pip_packages
    displayName: "Publish pip packages"
    jobs:
    - job: download_publish_pip_packages
      displayName: Download and Publish PIP Packages
      pool:
        vmImage: "ubuntu-latest"
      steps:
        - task: Bash@3
          displayName: "Step 1: Install Tools"
          inputs:
            pwsh: false
            targetType: 'filePath'
            filePath: "scripts/pipeline-push-pip-package-initiation.sh"

        - task: TwineAuthenticate@0
          displayName: "Step 2: Configure Feed Connection"
          inputs:
            artifactFeeds: $(feedName)

        - task: Bash@3
          displayName: "Step 3: Build, Clean, and Push"
          inputs:
            pwsh: false
            targetType: 'filePath'
            filePath: "scripts/pipeline-push-pip-package.sh"
            arguments: -o '$(adoOrgName)' -f '$(feedName)' -p '${{parameters.package}}' -r $(PYPIRC_PATH)
