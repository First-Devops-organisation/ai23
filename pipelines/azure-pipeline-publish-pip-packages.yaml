trigger: none

pool:
  vmImage: 'ubuntu-latest'

parameters:
- name: jarUrl
  displayName: "Direct URL to JAR file"
  type: string
  default: "https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar"
- name: groupId
  displayName: "Maven Group ID"
  type: string
  default: "com.mycompany.test"
- name: artifactId
  displayName: "Maven Artifact ID"
  type: string
  default: "my-test-package"
- name: version
  displayName: "Maven Version"
  type: string
  default: "1.0.1"

variables:
  feedName: 'github_migration_feed'
  # Update these two variables to match your Azure DevOps organization and project
  adoOrg: 'YashTech-DevOps'
  adoProject: 'YASH-DevOps-Serverless'

steps:
- task: MavenAuthenticate@0
  displayName: 'Maven Authenticate'
  inputs:
    # For project-scoped feeds, MavenAuthenticate requires "ProjectName/FeedName"
    # If your feed is organization-scoped, remove the "$(System.TeamProject)/" part.
    artifactsFeeds: '$(System.TeamProject)/$(feedName)'

- task: Bash@3
  displayName: 'Download and Push JAR to Azure Artifacts'
  inputs:
    targetType: 'inline'
    script: |
      set -e
      
      echo "Downloading JAR from ${{ parameters.jarUrl }}..."
      wget -O package.jar "${{ parameters.jarUrl }}"
      
      echo "Verifying downloaded file:"
      ls -lh package.jar
      file package.jar || true
      
      echo "Deploying to Azure Artifacts..."
      # Capture Maven output to a file so we can extract the exact error
      if ! mvn -e deploy:deploy-file \
        -DgroupId="${{ parameters.groupId }}" \
        -DartifactId="${{ parameters.artifactId }}" \
        -Dversion="${{ parameters.version }}" \
        -Dpackaging="jar" \
        -Dfile="package.jar" \
        -DrepositoryId="$(System.TeamProject)/$(feedName)" \
        -Durl="https://pkgs.dev.azure.com/$(adoOrg)/$(adoProject)/_packaging/$(feedName)/maven/v1" > mvn_output.log 2>&1; then
        
        echo "======================================================================"
        echo "MAVEN DEPLOYMENT FAILED!"
        echo "Extracting the exact HTTP error from Azure Artifacts:"
        grep -i "Return code is:" mvn_output.log || echo "Could not find HTTP return code in log."
        grep -i "status code:" mvn_output.log || true
        echo "======================================================================"
        echo "Last 20 lines of Maven log:"
        tail -n 20 mvn_output.log
        exit 1
      fi
      
      echo "Deployment successful!"
