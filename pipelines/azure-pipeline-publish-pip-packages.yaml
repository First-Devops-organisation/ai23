trigger: none

pool:
  vmImage: 'ubuntu-latest'

parameters:
- name: jarUrl
  displayName: "Direct URL to JAR file"
  type: string
  default: "https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar"
- name: groupId
  displayName: "Maven Group ID"
  type: string
  default: "com.mycompany.test"
- name: artifactId
  displayName: "Maven Artifact ID"
  type: string
  default: "my-test-package"
- name: version
  displayName: "Maven Version"
  type: string
  default: "1.0.0"

variables:
  # Format: us-central1-maven.pkg.dev/YOUR_GCP_PROJECT_ID/YOUR_REPO_NAME
  googleArtifactRegistryUrl: 'us-central1-maven.pkg.dev/my-gcp-project/my-maven-repo'

steps:
# 1. Authenticate to Google Cloud
# You must create a pipeline secret variable named 'GCP_SERVICE_ACCOUNT_KEY' containing your JSON key
- task: Bash@3
  displayName: 'Authenticate with Google Cloud'
  inputs:
    targetType: 'inline'
    script: |
      echo "Setting up Google Cloud authentication..."
      echo "$(GCP_SERVICE_ACCOUNT_KEY)" > gcp_key.json
      gcloud auth activate-service-account --key-file=gcp_key.json
      # Set the GOOGLE_APPLICATION_CREDENTIALS env var so Maven picks it up automatically
      echo "##vso[task.setvariable variable=GOOGLE_APPLICATION_CREDENTIALS]$(pwd)/gcp_key.json"

# 2. Download and Push to GAR
- task: Bash@3
  displayName: 'Download and Push JAR to Google Artifact Registry'
  inputs:
    targetType: 'inline'
    script: |
      set -e
      
      echo "Downloading JAR from ${{ parameters.jarUrl }}..."
      wget -O package.jar "${{ parameters.jarUrl }}"
      
      echo "Deploying to Google Artifact Registry..."
      # We reference pom_sample.xml so Maven loads the Google Wagon extension
      mvn deploy:deploy-file \
        -f pom_sample.xml \
        -DgroupId="${{ parameters.groupId }}" \
        -DartifactId="${{ parameters.artifactId }}" \
        -Dversion="${{ parameters.version }}" \
        -Dpackaging="jar" \
        -Dfile="package.jar" \
        -DrepositoryId="artifact-registry" \
        -Durl="artifactregistry://$(googleArtifactRegistryUrl)"
      
      echo "Deployment successful!"
